services:
  db:
    image: pgvector/pgvector:pg17
    container_name: dotnet-rag-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: ragdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
